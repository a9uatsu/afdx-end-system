name: Normalize repository authorship

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reauthor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite commit authorship
        run: |
          set -euo pipefail
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            export GIT_AUTHOR_NAME="a9uatsu"
            export GIT_AUTHOR_EMAIL="a9uatsu@users.noreply.github.com"
            export GIT_COMMITTER_NAME="a9uatsu"
            export GIT_COMMITTER_EMAIL="a9uatsu@users.noreply.github.com"
          ' -- --all
          git push --force origin HEAD:main
